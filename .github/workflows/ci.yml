name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege: CI only reads the repository.
permissions:
  contents: read

jobs:
  ci:
    # Pinned rather than ubuntu-latest: the label migrates to a new image on a
    # schedule we do not control, and this project pins everything else.
    runs-on: ubuntu-24.04
    steps:
      # Actions are pinned to commit SHAs, not tags: a tag can be moved, a SHA
      # cannot. Update the trailing comment whenever the SHA changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          check-latest: true

      - name: Run checks
        run: ./scripts/ci.sh
