# Secret scanning for the Forgelore repository.
#
# Phase 6 extends this file: the same rules gate team records before they can
# be committed, alongside Forgelore's own redaction pass (plan, K13 and Faz 6).

title = "forgelore"

[extend]
# Start from the upstream ruleset rather than maintaining our own copy.
useDefault = true

[[allowlists]]
description = """
Vendored third-party code. SQLite's amalgamation, translated to Go, contains
generated string constants that match the generic key heuristic; nine of them
today. Scanning it produces noise at a rate that makes the signal useless, and
it is not where this scan earns its keep: the point is what we write and what
Forgelore records. The supply chain is controlled by pinned versions, go.sum
and the vendored tree being reviewable, not by this rule.
"""
paths = ['''^vendor/''']

[[allowlists]]
description = """
Two fixtures from the redaction test. A test that proves a credential is
masked has to contain something shaped like one, and these two are: a
sixteen-character key after an --api-key flag, and the base64 of
"user:password" in an Authorization header.

Allowed by value and not by path, which is deliberate and was measured. A
`paths` entry exempts the whole file — tried, and a different planted secret
in that same test went unreported while the identical string in another file
was caught. So the scope is these two strings anywhere, and every other
secret in the redaction test is still a finding.
"""
regexes = ['''abcd1234efgh5678''', '''dXNlcjpwYXNzd29yZA==''']
