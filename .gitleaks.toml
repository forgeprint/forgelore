# Secret scanning for the Forgelore repository.
#
# Phase 6 extends this file: the same rules gate team records before they can
# be committed, alongside Forgelore's own redaction pass (plan, K13 and Faz 6).

title = "forgelore"

[extend]
# Start from the upstream ruleset rather than maintaining our own copy.
useDefault = true

[[allowlists]]
description = """
Vendored third-party code. SQLite's amalgamation, translated to Go, contains
generated string constants that match the generic key heuristic; nine of them
today. Scanning it produces noise at a rate that makes the signal useless, and
it is not where this scan earns its keep: the point is what we write and what
Forgelore records. The supply chain is controlled by pinned versions, go.sum
and the vendored tree being reviewable, not by this rule.
"""
paths = ['''^vendor/''']
